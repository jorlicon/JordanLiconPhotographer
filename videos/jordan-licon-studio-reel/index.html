<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f0ebe2;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-window-room"
        class="scene"
        data-composition-id="01-window-room"
        data-composition-src="compositions/frames/01-window-room.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-loft-wide"
        class="scene"
        data-composition-id="02-loft-wide"
        data-composition-src="compositions/frames/02-loft-wide.html"
        data-start="3.5"
        data-duration="3.9"
        data-track-index="1"
      ></div>

      <div
        id="el-03-lighting-corner"
        class="scene"
        data-composition-id="03-lighting-corner"
        data-composition-src="compositions/frames/03-lighting-corner.html"
        data-start="7"
        data-duration="4.1"
        data-track-index="0"
      ></div>

      <div
        id="el-04-warehouse"
        class="scene"
        data-composition-id="04-warehouse"
        data-composition-src="compositions/frames/04-warehouse.html"
        data-start="10.5"
        data-duration="3.6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-lounge-kitchen"
        class="scene"
        data-composition-id="05-lounge-kitchen"
        data-composition-src="compositions/frames/05-lounge-kitchen.html"
        data-start="13.5"
        data-duration="3.9"
        data-track-index="0"
      ></div>

      <div
        id="el-06-brand-close"
        class="scene"
        data-composition-id="06-brand-close"
        data-composition-src="compositions/frames/06-brand-close.html"
        data-start="17"
        data-duration="3"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-window-room", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-02-loft-wide", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.to("#el-02-loft-wide", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 7);
        tl.fromTo("#el-03-lighting-corner", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 7);
        tl.to("#el-03-lighting-corner", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 10.5);
        tl.fromTo("#el-04-warehouse", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 10.5);
        tl.to("#el-04-warehouse", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 13.5);
        tl.fromTo("#el-05-lounge-kitchen", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 13.5);
        tl.to("#el-05-lounge-kitchen", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 17);
        tl.fromTo("#el-06-brand-close", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 17);
        tl.to({}, { duration: 20 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
