# Format variant: short-tiktok-raw
# Only steps 3 (graphics) and 5 (captions) read this file — every other
# pipeline step is identical across formats.

format: short-tiktok-raw
aspect_ratio: "9:16"
resolution: [1080, 1920]

graphics:
  layout: hook-card-then-raw   # a single hook card at open, then untouched raw footage
  preset: tiktok-raw-style     # presets/tiktok-raw-style.json

captions:
  enabled: true
  style: captions-style        # presets/captions-style.json (position/timing overridden below)
  position: low-under-face
  timing: on-beat              # per-word cuts synced to the transcript, not sentence-locked

thumbnail:
  generate: false
  note: "skip — TikTok/Reels ignore custom thumbnails on native uploads"
