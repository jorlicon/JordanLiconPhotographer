<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=/credits.html">
<link rel="canonical" href="https://www.jordanliconphotography.com/credits.html">
<title>Redirecting | Jordan Licon Photography</title>
<script>location.replace("/credits.html");</script>
<script src="https://analytics.ahrefs.com/analytics.js" data-key="MnBbOoLS0I9O1x9eQidDhQ" async></script>
</head>
<body>
<p>Redirecting to <a href="/credits.html">Jordan Licon Photography credits and recognition</a>.</p>
<script data-jlp-conversion-tracking>
(function(){
  function pushEvent(name, data){window.dataLayer=window.dataLayer||[];window.gtag=window.gtag||function(){window.dataLayer.push(arguments);};window.gtag("event",name,Object.assign({page_path:location.pathname},data||{}));}
  function trackCta(el){
    var href=el.getAttribute("href")||"", label=(el.textContent||el.getAttribute("aria-label")||href||"cta").trim(), eventName="jlp_cta_click", ctaType="other";
    if(href.indexOf("Professional-Headshot")!==-1){eventName="click_book_headshot";ctaType="headshot_booking";}
    else if(href.indexOf("/discovery")!==-1){eventName="click_start_consultation";ctaType="consultation_booking";}
    else if(href.indexOf("mailto:")===0){eventName="click_email_brief";ctaType="email_inquiry";}
    else if(href.indexOf("tel:")===0){eventName="click_phone";ctaType="phone_inquiry";}
    else if(href==="#contact"){eventName="click_inquire";ctaType="inquiry_form";}
    var data={cta_label:label,cta_href:href,cta_type:ctaType};
    pushEvent("jlp_cta_click",data);
    if(eventName!=="jlp_cta_click")pushEvent(eventName,data);
  }
  document.querySelectorAll('a[href*="bloom.io"],a[href^="mailto:"],a[href^="tel:"],a[href="#contact"],button[type="submit"]').forEach(function(el){
    if(el.dataset.jlpTracked)return;
    el.dataset.jlpTracked="true";
    el.addEventListener("click",function(){trackCta(el);});
  });
  document.querySelectorAll("form").forEach(function(form){
    if(form.dataset.jlpFormTracked)return;
    form.dataset.jlpFormTracked="true";
    var formStarted=false;
    form.addEventListener("focusin",function(){
      if(formStarted)return;
      formStarted=true;
      pushEvent("form_start",{form_id:form.id||form.getAttribute("name")||"form",form_name:form.getAttribute("name")||form.id||"project-inquiry",page_path:location.pathname});
    });
    form.addEventListener("submit",function(){
      var leadData={form_id:form.id||form.getAttribute("name")||"form",lead_type:"project_inquiry"};
      pushEvent("jlp_form_submit",leadData);
      pushEvent("submit_project_inquiry",leadData);
      pushEvent("generate_lead",leadData);
    });
  });
})();
</script></body>
</html>
