<script data-bloom-gray-button>
(function(){
  const base="#6f7378", hover="#83878d";
  function labelFor(el){return [el.id,el.className,el.getAttribute("aria-label"),el.getAttribute("title"),el.getAttribute("href")].join(" ").toLowerCase();}
  function apply(root){
    root.querySelectorAll('button,a,[role="button"]').forEach(function(el){
      if(!labelFor(el).includes("bloom"))return;
      el.style.setProperty("background-color",base,"important");
      el.style.setProperty("border-color",base,"important");
      el.style.setProperty("color","#fff","important");
      if(!el.dataset.bloomGrayHover){
        el.dataset.bloomGrayHover="true";
        el.addEventListener("mouseenter",function(){el.style.setProperty("background-color",hover,"important")});
        el.addEventListener("mouseleave",function(){el.style.setProperty("background-color",base,"important")});
      }
    });
  }
  document.addEventListener("DOMContentLoaded",function(){apply(document)});
  new MutationObserver(function(mutations){
    apply(document);
    mutations.forEach(function(mutation){
      mutation.addedNodes.forEach(function(node){
        if(node.nodeType===1&&node.shadowRoot)apply(node.shadowRoot);
      });
    });
  }).observe(document.documentElement,{childList:true,subtree:true});
})();
