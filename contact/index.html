<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=/#contact">
<link rel="canonical" href="https://www.jordanliconphotography.com/#contact">
<title>Redirecting | Jordan Licon Photography</title>
<script>location.replace("/#contact");</script>
</head>
<body>
<p>Redirecting to <a href="/#contact">Jordan Licon Photography contact</a>.</p>
<script data-jlp-conversion-tracking>
(function(){
  function pushEvent(name, data){window.dataLayer=window.dataLayer||[];window.dataLayer.push(Object.assign({event:name,page_path:location.pathname},data||{}));}
  document.querySelectorAll('a[href*="bloom.io"],a[href^="mailto:"],a[href^="tel:"],a[href="#contact"],button[type="submit"]').forEach(function(el){
    if(el.dataset.jlpTracked)return;
    el.dataset.jlpTracked="true";
    el.addEventListener("click",function(){pushEvent("jlp_cta_click",{cta_label:(el.textContent||el.getAttribute("aria-label")||el.getAttribute("href")||"cta").trim(),cta_href:el.getAttribute("href")||""});});
  });
  document.querySelectorAll("form").forEach(function(form){
    if(form.dataset.jlpFormTracked)return;
    form.dataset.jlpFormTracked="true";
    form.addEventListener("submit",function(){pushEvent("jlp_form_submit",{form_id:form.id||form.getAttribute("name")||"form"});});
  });
})();
</script></body>
</html>
