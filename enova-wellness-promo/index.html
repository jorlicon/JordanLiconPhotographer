<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Enova Wellness Center — Brand Film (16:9 master, placeholder cut)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #2f3a2e;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!--
      PLACEHOLDER CUT — every frame is a labeled placeholder. No real Enova
      footage, photography, or brand assets were supplied to this session.
      See BRIEF.md § Assets and MISSING-ASSETS.md for exactly what's needed
      before this can be finished. Do not publish or present this render as
      final — it exists to prove the timing, structure, and pipeline.

      Crossfade seams: 0.5s overlap at each cut, incoming clip on the higher
      (ping-ponged) track, stage ground painted opaque to avoid a white flash
      during the dip (see seam-craft doctrine).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="59.5"
      data-width="1920"
      data-height="1080"
      style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #2f3a2e"
    >
      <div
        id="el-01"
        class="clip"
        data-composition-id="01-location"
        data-composition-src="compositions/frames/01-location.html"
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-02"
        class="clip"
        data-composition-id="02-personalized-experience"
        data-composition-src="compositions/frames/02-personalized-experience.html"
        data-start="5.5"
        data-duration="10.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-03"
        class="clip"
        data-composition-id="03-treatments-montage"
        data-composition-src="compositions/frames/03-treatments-montage.html"
        data-start="15.5"
        data-duration="14.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-04"
        class="clip"
        data-composition-id="04-trust"
        data-composition-src="compositions/frames/04-trust.html"
        data-start="29.5"
        data-duration="13.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-05"
        class="clip"
        data-composition-id="05-transformation"
        data-composition-src="compositions/frames/05-transformation.html"
        data-start="42.5"
        data-duration="10.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-06"
        class="clip"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="52.5"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Crossfade each incoming clip in over the 0.5s overlap window.
      // The outgoing clip holds its extended final frame underneath;
      // the incoming clip sits on the higher track and fades over it.
      const seams = [
        { el: "#el-02", t: 5.5 },
        { el: "#el-03", t: 15.5 },
        { el: "#el-04", t: 29.5 },
        { el: "#el-05", t: 42.5 },
        { el: "#el-06", t: 52.5 },
      ];
      seams.forEach(({ el, t }) => {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, t);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
