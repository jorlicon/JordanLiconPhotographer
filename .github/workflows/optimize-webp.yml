name: Optimize legacy images to WebP

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: optimize-webp
  cancel-in-progress: false

jobs:
  webp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install Pillow
      - name: Convert referenced images and rewrite the page
        run: |
          python3 scripts/optimize-webp.py --page architecture.html
          python3 scripts/optimize-webp.py --page headshot-portfolio.html
      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Serve page images as WebP [skip ci]"
            git push
          fi
